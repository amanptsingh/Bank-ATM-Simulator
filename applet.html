<html>
<head>
    <title>Bank Applets</title>
</head>
<body>
    <h2>Welcome Applet</h2>
    <applet code="bank.applet.WelcomeApplet.class" codebase="out" width="400" height="100">
        <param name="bankName" value="Student National Bank">
    </applet>

    <h2>Interest Calculator (JApplet)</h2>
    <applet code="bank.applet.InterestApplet.class" codebase="out" width="400" height="160">
        <param name="bankName" value="Student National Bank">
        <param name="rate" value="6.5">
    </applet>
</body>
</html>
